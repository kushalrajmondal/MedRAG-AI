<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediMate AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="chat-container">

        <!-- ================= HEADER ================= -->

        <header class="chat-header">

            <div class="bot-icon">
                ⚕
            </div>

            <div class="header-info">

                <h1>MediMate AI</h1>

                <div class="status">
                    <span class="status-dot"></span>
                    Online
                </div>

            </div>

        </header>


        <!-- ================= CHAT AREA ================= -->

        <main class="chat-body" id="chatBody">

            <!-- Initial AI message -->

            <div class="bot-message">

                <p>
                    Hello! I’m your Virtual Healthcare Assistant. 👋
                </p>

                <p class="second-message">
                    How can I help you today?

                    <span class="time">
                        10:58 AM
                    </span>
                </p>

            </div>

        </main>


        <!-- ================= INPUT AREA ================= -->

        <section class="input-section">

            <div class="input-box">

                <textarea
                    id="messageInput"
                    placeholder="Write your message..."
                    rows="1"></textarea>

                <button
                    id="sendButton"
                    class="send-button"
                    type="button">

                    ↑

                </button>

            </div>


            <!-- Disclaimer -->

            

        </section>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        const messageInput =
            document.getElementById("messageInput");

        const sendButton =
            document.getElementById("sendButton");

        const chatBody =
            document.getElementById("chatBody");


        // =========================
        // SEND BUTTON
        // =========================

        sendButton.addEventListener(
            "click",
            sendMessage
        );


        // =========================
        // ENTER KEY
        // =========================

        messageInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    sendMessage();

                }

            }
        );


        // =========================
        // SEND MESSAGE
        // =========================

        async function sendMessage() {

            const message =
                messageInput.value.trim();


            // Don't send empty message

            if (message === "") {
                return;
            }


            // =========================
            // CREATE USER MESSAGE
            // =========================

            const userMessage =
                document.createElement("div");

            userMessage.classList.add(
                "user-message"
            );

            userMessage.textContent =
                message;

            chatBody.appendChild(
                userMessage
            );


            // Clear input

            messageInput.value = "";


            // Scroll down

            chatBody.scrollTop =
                chatBody.scrollHeight;


            // Disable button

            sendButton.disabled = true;

            sendButton.textContent = "...";


            try {

                // =========================
                // SEND REQUEST TO FLASK
                // =========================

                const response =
                    await fetch("/get", {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body: new URLSearchParams({
                            msg: message
                        })

                    });


                // Get server response

                const answer =
                    await response.text();


                console.log(
                    "Server response:",
                    answer
                );


                // Check Flask error

                if (!response.ok) {

                    throw new Error(
                        answer
                    );

                }


                // =========================
                // CREATE AI MESSAGE
                // =============

                const botMessage =
                    document.createElement("div");

                botMessage.classList.add(
                    "bot-message",
                    "response-message"
                );


                const answerText =
                    document.createElement("p");

                answerText.textContent =
                    answer;


                botMessage.appendChild(
                    answerText
                );


                chatBody.appendChild(
                    botMessage
                );


                // Scroll to bottom

                chatBody.scrollTop =
                    chatBody.scrollHeight;


            }

            catch (error) {

                console.error(
                    "Error:",
                    error
                );


                // =========================
                // ERROR MESSAGE
                // =========================

                const errorMessage =
                    document.createElement("div");

                errorMessage.classList.add(
                    "bot-message",
                    "response-message"
                );


                const errorText =
                    document.createElement("p");

                errorText.textContent =
                    "Sorry, something went wrong. Please try again.";


                errorMessage.appendChild(
                    errorText
                );


                chatBody.appendChild(
                    errorMessage
                );


                chatBody.scrollTop =
                    chatBody.scrollHeight;

            }


            // Enable button again

            sendButton.disabled = false;

            sendButton.textContent = "↑";

            messageInput.focus();

        }

    </script>

</body>

</html>
